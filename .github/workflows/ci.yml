# Installation is explicit: copy to .github/workflows/ci.yml after repository
# workflow-write access and required status checks are established.
name: Garden CI and release artifact
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: garden-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - run: npm run qa:browser
      - name: Package committed source
        if: github.event_name != 'pull_request'
        run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: garden-${{ github.sha }}
          path: |
            .release/garden.tar.gz
            .release/manifest.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      # There is deliberately no SSH, cloud API, secret, or production write step.
      # Download the reviewed artifact and promote it with install_release.py.
